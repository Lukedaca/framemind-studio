name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test:run

      - name: Build verification (no deployment)
        run: npm run build
      - name: Desktop frontend verification
        run: npm run build:desktop
      - name: Install optional screenshot tooling
        run: npm install --no-save --package-lock=false playwright@1.61.1
      - name: Capture current release interface with public demo images
        env:
          STUDIO_CAPTURE_BROWSER: /usr/bin/google-chrome
        run: node scripts/capture-release-ui.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: FrameMind-Studio-0.1.2-interface
          path: output/playwright/release-ui/
          if-no-files-found: error
